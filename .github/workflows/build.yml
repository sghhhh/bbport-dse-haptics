name: DSE binaries

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows x86-64
    runs-on: windows-2025
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.10'
          architecture: x64
      - uses: msys2/setup-msys2@3c51bf698df1e37b2261f53cb67797b97761185c # v2
        id: msys2
        with:
          msystem: CLANG64
          update: true
          install: >-
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-lld
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-pkgconf
            mingw-w64-clang-x86_64-vulkan-headers
            mingw-w64-clang-x86_64-vulkan-loader
            mingw-w64-clang-x86_64-vulkan-memory-allocator
            mingw-w64-clang-x86_64-glslang
            mingw-w64-clang-x86_64-fmt
            mingw-w64-clang-x86_64-boost
            mingw-w64-clang-x86_64-robin-map
            mingw-w64-clang-x86_64-xxhash
            mingw-w64-clang-x86_64-zydis
            mingw-w64-clang-x86_64-spirv-headers
            mingw-w64-clang-x86_64-spirv-tools
            mingw-w64-clang-x86_64-spirv-cross
            mingw-w64-clang-x86_64-nlohmann-json
      - name: Build and verify Windows package
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          ./scripts/ci-windows.ps1 -Clang64 (Join-Path $env:MSYS2_LOCATION 'clang64') `
            -Scratch (Join-Path $env:RUNNER_TEMP 'dse-build') `
            -OutputDir (Join-Path $env:RUNNER_TEMP 'dse-release')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dse8-windows-x86_64
          path: ${{ runner.temp }}/dse-release/bbport-dse8-windows-x86_64.zip
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dse8-profiles
          path: ${{ runner.temp }}/dse-release/bbport-dse8-profiles.zip
          if-no-files-found: error
          compression-level: 0

  linux:
    name: Linux x86-64
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          install_url: https://releases.nixos.org/nix/nix-2.36.0/install
          nix_path: nixpkgs=https://releases.nixos.org/nixpkgs/nixpkgs-26.11pre1125912.93a9ed0a8660/nixexprs.tar.xz
      - name: Apply the Linux beta source patch
        shell: bash
        run: |
          base="$RUNNER_TEMP/dse-linux"
          mkdir -p "$base" "$RUNNER_TEMP/dse-release"
          curl --fail --location --retry 3 --silent --show-error \
            https://github.com/Supermedo/bloodborne_pc/releases/download/linux-seamless-beta.1/bb-probe-seamless-linux-beta.1-source.zip \
            -o "$base/source.zip"
          echo "9d85c78d99c89f51dfc8cba979abb4ce2b544a2c5797a4fc7c99afad27bcc114  $base/source.zip" | sha256sum -c
          unzip -q "$base/source.zip" -d "$base"
          source="$base/bb-probe-seamless-linux-beta.1-src"
          git -C "$source" apply --check --whitespace=error "$GITHUB_WORKSPACE/patches/seamless-linux-dse-haptics.patch"
          git -C "$source" apply --whitespace=error "$GITHUB_WORKSPACE/patches/seamless-linux-dse-haptics.patch"
      - name: Build and package the native Linux engine
        shell: bash
        run: |
          source="$RUNNER_TEMP/dse-linux/bb-probe-seamless-linux-beta.1-src"
          export DSE_CI_SOURCE="$source"
          nix-shell "$source/shell.nix" --run '
            set -eu
            tools=$(mktemp -d)
            printf "#!/bin/sh\nexec \"%s\" -j2 \"\$@\"\n" "$(command -v ninja)" > "$tools/ninja"
            chmod +x "$tools/ninja"
            export PATH="$tools:$PATH"
            bash "$GITHUB_WORKSPACE/scripts/build-seamless-linux.sh" "$DSE_CI_SOURCE"
            python3 "$GITHUB_WORKSPACE/scripts/package-linux.py" \
              --source "$DSE_CI_SOURCE" \
              --output "$RUNNER_TEMP/dse-release/bbport-dse8-linux-x86_64.tar.gz" \
              --nixpkgs-revision 93a9ed0a866099a230ed5146a5bb7d16fd5c9b14
          '
      - name: Verify the portable Linux package
        shell: bash
        run: |
          unpack="$RUNNER_TEMP/dse package test"
          mkdir -p "$unpack"
          tar -xzf "$RUNNER_TEMP/dse-release/bbport-dse8-linux-x86_64.tar.gz" -C "$unpack"
          payload="$unpack/release-payload"
          (cd "$payload" && sha256sum --quiet --check SHA256SUMS)
          docker run --rm --network none -v "$payload:/dse package:ro" ubuntu:24.04 bash -c '
            set -u
            export LD_BIND_NOW=1
            message=$("/dse package/bin/bb-probe" 2>&1)
            status=$?
            if [ "$status" -ne 1 ] || ! grep -q "Usage:" <<< "$message"; then
                printf "%s\n" "$message"
                exit 1
            fi
            echo "The Linux engine reached its usage screen outside the Nix store."
          '
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dse8-linux-x86_64
          path: ${{ runner.temp }}/dse-release/bbport-dse8-linux-x86_64.tar.gz
          if-no-files-found: error
          compression-level: 0
